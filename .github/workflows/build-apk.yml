
name: Build Crypto Radar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto-radar-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          unzip -q crypto-radar-project.zip -d appsrc
          cd appsrc/crypto-radar-project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-radar-debug-apk
          path: appsrc/crypto-radar-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
